# Modular: cuma Qdrant. Jalankan berdiri sendiri dengan:
#   docker compose -f docker/qdrant/docker-compose.yml up -d
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_fed_news
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333

volumes:
  qdrant_storage:
    driver: local
